<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebFlow | Browser-Based CFD Tool</title>
    <!-- Tailwind CSS for UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Professional Dark Grey Background */
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #111111;
            font-family: 'Inter', sans-serif; 
        }
        canvas { display: block; width: 100vw; height: 100vh; outline: none; }
        
        /* Custom Scrollbar for panel */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #2d2d2d; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

        .glass-panel {
            background: rgba(20, 20, 25, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .range-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: #4b5563;
            border-radius: 2px;
            outline: none;
        }
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #3b82f6;
            border-radius: 50%;
            cursor: pointer;
            transition: background .15s ease-in-out;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .range-slider::-webkit-slider-thumb:hover { background: #60a5fa; }
    </style>
</head>
<body>

    <!-- 3D Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <!-- UI Panel -->
    <div class="absolute top-4 left-4 w-80 glass-panel rounded-xl text-gray-100 p-5 z-10 flex flex-col gap-5 transition-all duration-300">
        
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-gray-700 pb-3">
            <h1 class="text-xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-cyan-300">
                WebFlow
            </h1>
            <span class="text-xs text-gray-400 font-mono">v1.14</span>
        </div>

        <!-- Upload Section -->
        <div class="flex flex-col gap-2">
            <label class="text-xs uppercase tracking-wider text-gray-500 font-semibold">Geometry</label>
            <div class="relative group">
                <input type="file" id="stl-upload" accept=".stl" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20">
                <div class="flex items-center justify-center border-2 border-dashed border-gray-600 rounded-lg p-4 group-hover:border-blue-500 group-hover:bg-gray-800 transition-colors">
                    <div class="text-center">
                        <svg class="mx-auto h-8 w-8 text-gray-400 group-hover:text-blue-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                        <p id="file-label" class="mt-1 text-sm text-gray-300 font-medium">Upload .STL File</p>
                    </div>
                </div>
            </div>
            <p class="text-[10px] text-gray-500 text-center">Standard Tesselation Language (Binary/ASCII)</p>
        </div>

        <!-- Physics Settings -->
        <div class="flex flex-col gap-4">
            <label class="text-xs uppercase tracking-wider text-gray-500 font-semibold">Fluid Properties</label>
            
            <div class="grid grid-cols-2 gap-2">
                <button id="fluid-air" class="fluid-btn bg-blue-600 hover:bg-blue-500 text-xs py-2 rounded transition font-medium ring-2 ring-blue-400 shadow-lg shadow-blue-900/50">Air</button>
                <button id="fluid-water" class="fluid-btn bg-gray-700 hover:bg-gray-600 text-xs py-2 rounded transition font-medium">Water</button>
            </div>

            <div>
                <div class="flex justify-between text-sm mb-1">
                    <span class="text-gray-300">Inlet Velocity</span>
                    <span id="velocity-val" class="text-blue-400 font-mono">25 m/s</span>
                </div>
                <input type="range" id="velocity-slider" min="0" max="100" value="25" class="range-slider">
            </div>
        </div>

        <!-- Visualization Mode -->
        <div class="flex flex-col gap-2">
            <label class="text-xs uppercase tracking-wider text-gray-500 font-semibold">Analysis View</label>
            
            <div class="flex flex-col gap-2">
                <label class="flex items-center gap-3 cursor-pointer p-2 hover:bg-white/5 rounded transition">
                    <div class="relative inline-block w-10 h-6 align-middle select-none">
                        <input type="checkbox" id="toggle-streamlines" checked class="sr-only peer">
                        <div class="w-10 h-6 bg-gray-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                    </div>
                    <span class="text-sm font-medium">Flow Streamlines</span>
                </label>

                <label class="flex items-center gap-3 cursor-pointer p-2 hover:bg-white/5 rounded transition">
                    <div class="relative inline-block w-10 h-6 align-middle select-none">
                        <input type="checkbox" id="toggle-pressure" class="sr-only peer">
                        <div class="w-10 h-6 bg-gray-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-red-500"></div>
                    </div>
                    <span class="text-sm font-medium">Surface Pressure</span>
                </label>
                
                 <label class="flex items-center gap-3 cursor-pointer p-2 hover:bg-white/5 rounded transition">
                    <div class="relative inline-block w-10 h-6 align-middle select-none">
                        <input type="checkbox" id="toggle-wireframe" class="sr-only peer">
                        <div class="w-10 h-6 bg-gray-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-500"></div>
                    </div>
                    <span class="text-sm font-medium">Wireframe</span>
                </label>
            </div>
        </div>

        <!-- Stats -->
        <div class="mt-2 pt-3 border-t border-gray-700">
             <div class="text-[10px] text-gray-500 uppercase">Status</div>
             <div id="status-text" class="text-sm font-mono text-yellow-400">Loading...</div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loader" class="hidden absolute inset-0 bg-black/80 z-50 flex items-center justify-center flex-col backdrop-blur-sm">
        <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-blue-500 mb-4 shadow-[0_0_15px_rgba(59,130,246,0.5)]"></div>
        <p class="text-white font-mono tracking-widest">PROCESSING</p>
    </div>

    <!-- Import Maps -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- Error Catcher -->
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            console.error(message);
        };
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { STLLoader } from 'three/addons/loaders/STLLoader.js';

        // --- Global State ---
        const state = {
            velocity: 25,
            fluid: 'air',
            showStreamlines: true,
            showPressure: false,
            showWireframe: false,
        };

        // --- Dynamic Simulation Bounds ---
        let simBounds = {
            spawnX: -15,      
            recycleX: 15,     
            minY: -5, maxY: 5,
            minZ: -5, maxZ: 5,
            // Precise object bounds for broadphase
            objMinX: 0, objMaxX: 0,
            objMinY: 0, objMaxY: 0,
            objMinZ: 0, objMaxZ: 0
        };

        // --- Scene Init ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x111111, 50, 300);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(-15, 10, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        
        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0x404040, 1.2); 
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(-10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);
        
        const rimLight = new THREE.SpotLight(0x4488ff, 5);
        rimLight.position.set(15, 5, -10);
        rimLight.lookAt(0,0,0);
        scene.add(rimLight);

        // --- Helpers ---
        const gridHelper = new THREE.GridHelper(100, 100, 0x555555, 0x222222);
        gridHelper.position.y = 0;
        scene.add(gridHelper);

        const axesHelper = new THREE.AxesHelper(3);
        axesHelper.position.set(0, 0, 0);
        scene.add(axesHelper);

        // --- Objects & Materials ---
        let mainMesh = null;
        let wireframeMesh = null;
        let particleSystem = null;
        let particlesData = [];
        
        // Streamline Settings
        const particleCount = 800; 
        const trailLength = 20;   
        const raycaster = new THREE.Raycaster();
        const rayOrigin = new THREE.Vector3();
        const rayDir = new THREE.Vector3();

        // Materials
        const defaultMat = new THREE.MeshStandardMaterial({ 
            color: 0xe0e0e0, 
            roughness: 0.4,
            metalness: 0.2,
            side: THREE.DoubleSide // Ensure raycast hits backfaces if inside
        });
        
        const pressureMaterial = new THREE.MeshStandardMaterial({
            vertexColors: true,
            roughness: 0.3,
            metalness: 0.1,
            side: THREE.DoubleSide
        });

        const wireframeMaterial = new THREE.MeshBasicMaterial({
            color: 0x00ff00,
            wireframe: true,
            visible: false,
            transparent: true,
            opacity: 0.2
        });

        // --- CFD Logic: Pressure Calculation ---
        function computePressure(geometry) {
            const count = geometry.attributes.position.count;
            const colors = [];
            const normal = new THREE.Vector3();
            const normalAttribute = geometry.getAttribute('normal');

            // Colors
            const colorHigh = new THREE.Color(1, 0.1, 0.1); // Red
            const colorLow = new THREE.Color(0.1, 0.1, 1);  // Blue
            const colorMid = new THREE.Color(0.1, 0.8, 0.1); // Green

            for (let i = 0; i < count; i++) {
                normal.fromBufferAttribute(normalAttribute, i);
                const alignment = normal.z; // Approx for default rotation
                
                const vertexColor = new THREE.Color();
                if (alignment > 0) vertexColor.copy(colorMid).lerp(colorHigh, alignment);
                else vertexColor.copy(colorMid).lerp(colorLow, Math.abs(alignment));
                
                colors.push(vertexColor.r, vertexColor.g, vertexColor.b);
            }
            
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        }

        // --- CFD Logic: Streamlines (Trails) ---
        function initParticles() {
            if (particleSystem) scene.remove(particleSystem);

            const segmentsPerParticle = trailLength - 1;
            const vertexCount = particleCount * segmentsPerParticle * 2;
            
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(vertexCount * 3);
            const colors = new Float32Array(vertexCount * 3);

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.LineBasicMaterial({ 
                vertexColors: true,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending,
                depthWrite: false, // Helps transparency
                linewidth: 1 
            });

            particleSystem = new THREE.LineSegments(geometry, material);
            particleSystem.visible = state.showStreamlines;
            scene.add(particleSystem);
            
            particlesData = [];
            for (let i = 0; i < particleCount; i++) {
                resetParticle(i, true);
            }
        }

        function resetParticle(i, initial = false) {
            const spawnX = simBounds.spawnX - Math.random() * 5; 
            const height = simBounds.maxY - simBounds.minY;
            const depth = simBounds.maxZ - simBounds.minZ;
            const y = simBounds.minY + Math.random() * height;
            const z = simBounds.minZ + Math.random() * depth;
            
            const p = { 
                vx: 1, vy: 0, vz: 0,
                history: []
            };
            
            for(let k=0; k<trailLength; k++) {
                const offsetX = initial ? (k * 0.5) : 0;
                p.history.push(new THREE.Vector3(spawnX - offsetX, y, z));
            }
            
            particlesData[i] = p;
        }

        function updateParticles() {
            if (!particleSystem || !mainMesh) return;
            
            const positions = particleSystem.geometry.attributes.position.array;
            const colors = particleSystem.geometry.attributes.color.array;
            
            // Sub-stepping settings
            const steps = 3; 
            const speedTotal = state.velocity / 50; 
            const subSpeed = speedTotal / steps;
            
            // Broadphase Collision Checks
            const checkMinX = simBounds.objMinX - 1;
            const checkMaxX = simBounds.objMaxX + 1;
            const checkMinY = simBounds.objMinY - 1;
            const checkMaxY = simBounds.objMaxY + 1;
            const checkMinZ = simBounds.objMinZ - 1;
            const checkMaxZ = simBounds.objMaxZ + 1;

            for (let i = 0; i < particleCount; i++) {
                const p = particlesData[i];
                let currentHead = p.history[0].clone();
                let didHit = false;

                // Perform sub-steps for physics
                for (let s = 0; s < steps; s++) {
                    const nextHead = currentHead.clone();
                    nextHead.x += p.vx * subSpeed;
                    nextHead.y += p.vy * subSpeed;
                    nextHead.z += p.vz * subSpeed;
                    
                    // Collision check (only if near object)
                    if (nextHead.x > checkMinX && nextHead.x < checkMaxX &&
                        nextHead.y > checkMinY && nextHead.y < checkMaxY &&
                        nextHead.z > checkMinZ && nextHead.z < checkMaxZ) {
                        
                        rayOrigin.copy(currentHead);
                        rayDir.set(p.vx, p.vy, p.vz).normalize();
                        raycaster.set(rayOrigin, rayDir);
                        // Tight raycast length to prevent overshooting
                        raycaster.far = subSpeed * 1.5; 

                        const intersects = raycaster.intersectObject(mainMesh);
                        
                        if (intersects.length > 0) {
                            const hit = intersects[0];
                            const normal = hit.face.normal.clone();
                            normal.transformDirection(mainMesh.matrixWorld).normalize();

                            const velocity = new THREE.Vector3(p.vx, p.vy, p.vz);
                            const dot = velocity.dot(normal);
                            
                            // Deflection
                            velocity.sub(normal.multiplyScalar(dot));
                            velocity.add(normal.multiplyScalar(0.2)); // Stronger push out
                            velocity.normalize();

                            p.vx = velocity.x;
                            p.vy = velocity.y;
                            p.vz = velocity.z;

                            // Snap to safe position
                            currentHead.copy(hit.point).add(normal.multiplyScalar(0.15));
                            didHit = true;
                            // Break sub-steps on hit to process new direction next time
                            break; 
                        }
                    }
                    currentHead.copy(nextHead);
                    
                    // Recycle check inside sub-step
                    if (currentHead.x > simBounds.recycleX || Math.abs(currentHead.y) > simBounds.maxY * 2) {
                        resetParticle(i);
                        currentHead = p.history[0]; // Reset temp to new start
                        break;
                    }
                }

                // Update History Ring with final position
                p.history.unshift(currentHead);
                p.history.pop();

                // Update Buffer Geometry
                const particleOffset = i * (trailLength - 1) * 2 * 3;
                const headColor = new THREE.Color(0.2, 0.8, 1); 
                const tailColor = new THREE.Color(0.0, 0.1, 0.4); 

                for (let k = 0; k < trailLength - 1; k++) {
                    const p1 = p.history[k];
                    const p2 = p.history[k+1];
                    const idx = particleOffset + (k * 6); 
                    
                    positions[idx] = p1.x; positions[idx+1] = p1.y; positions[idx+2] = p1.z;
                    positions[idx+3] = p2.x; positions[idx+4] = p2.y; positions[idx+5] = p2.z;
                    
                    const alpha = 1 - (k / (trailLength));
                    const c = headColor.clone().lerp(tailColor, 1-alpha);
                    
                    colors[idx] = c.r; colors[idx+1] = c.g; colors[idx+2] = c.b;
                    colors[idx+3] = c.r; colors[idx+4] = c.g; colors[idx+5] = c.b;
                }
            }
            
            particleSystem.geometry.attributes.position.needsUpdate = true;
            particleSystem.geometry.attributes.color.needsUpdate = true;
        }

        // --- Central Update Logic ---
        function updateScene(geometry, filename) {
            if (mainMesh) { scene.remove(mainMesh); mainMesh.geometry.dispose(); }
            if (wireframeMesh) { scene.remove(wireframeMesh); wireframeMesh.geometry.dispose(); }

            geometry.computeBoundingBox();
            const center = new THREE.Vector3();
            geometry.boundingBox.getCenter(center);
            geometry.translate(-center.x, -center.y, -center.z);

            computePressure(geometry);

            mainMesh = new THREE.Mesh(geometry, state.showPressure ? pressureMaterial : defaultMat);
            mainMesh.castShadow = true;
            mainMesh.receiveShadow = true;
            
            if (geometry.type !== 'BoxGeometry') {
                mainMesh.rotation.x = -Math.PI / 2;
            } else {
                mainMesh.rotation.set(0,0,0);
            }
            
            mainMesh.position.set(0, 0, 0);
            
            // Important: Update Matrix World for Raycaster
            mainMesh.updateMatrixWorld(true);
            
            scene.add(mainMesh);
            
            // Update Bounds
            const box = new THREE.Box3().setFromObject(mainMesh);
            const size = new THREE.Vector3();
            box.getSize(size);

            simBounds.objMinX = box.min.x; simBounds.objMaxX = box.max.x;
            simBounds.objMinY = box.min.y; simBounds.objMaxY = box.max.y;
            simBounds.objMinZ = box.min.z; simBounds.objMaxZ = box.max.z;

            simBounds.spawnX = box.min.x - 5; 
            simBounds.recycleX = box.max.x + 10;
            
            const margin = Math.max(size.y, size.z) * 0.5;
            simBounds.minY = box.min.y - margin;
            simBounds.maxY = box.max.y + margin;
            simBounds.minZ = box.min.z - margin;
            simBounds.maxZ = box.max.z + margin;

            wireframeMesh = new THREE.Mesh(geometry, wireframeMaterial);
            wireframeMesh.rotation.copy(mainMesh.rotation);
            wireframeMesh.position.copy(mainMesh.position);
            wireframeMesh.visible = state.showWireframe;
            scene.add(wireframeMesh);

            initParticles();

            document.getElementById('status-text').innerText = "Loaded: " + filename;
            document.getElementById('status-text').className = "text-sm font-mono text-green-400";
            document.getElementById('loader').classList.add('hidden');
        }

        // --- Initial Load Logic ---
        function init() {
            const loader = new STLLoader();
            loader.load(
                './cube.stl',
                function (geometry) {
                    updateScene(geometry, "cube.stl");
                },
                function (xhr) {},
                function (error) {
                    console.warn("Failed to load cube.stl");
                    const boxGeo = new THREE.BoxGeometry(4, 4, 4);
                    updateScene(boxGeo, "Fallback Cube");
                    document.getElementById('status-text').innerText = "Loaded: Fallback (cube.stl missing)";
                    document.getElementById('status-text').className = "text-sm font-mono text-yellow-500";
                }
            );
        }

        // --- Event Listeners ---
        const uploadInput = document.getElementById('stl-upload');
        uploadInput.addEventListener('click', () => { uploadInput.value = null; });
        uploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            document.getElementById('file-label').innerText = file.name;
            document.getElementById('loader').classList.remove('hidden');
            
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const loader = new STLLoader();
                    const geometry = loader.parse(event.target.result);
                    updateScene(geometry, file.name);
                } catch (err) {
                    alert("Error parsing STL.");
                    document.getElementById('loader').classList.add('hidden');
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // UI Toggles
        document.getElementById('toggle-wireframe').addEventListener('change', (e) => {
            state.showWireframe = e.target.checked;
            if(wireframeMesh) wireframeMesh.visible = e.target.checked;
        });

        document.getElementById('toggle-streamlines').addEventListener('change', (e) => {
            state.showStreamlines = e.target.checked;
            if(particleSystem) particleSystem.visible = e.target.checked;
        });

        document.getElementById('toggle-pressure').addEventListener('change', (e) => {
            state.showPressure = e.target.checked;
            if(mainMesh) mainMesh.material = state.showPressure ? pressureMaterial : defaultMat;
        });
        
        // Velocity Slider
        const velSlider = document.getElementById('velocity-slider');
        const velDisplay = document.getElementById('velocity-val');
        velSlider.addEventListener('input', (e) => {
            state.velocity = parseInt(e.target.value);
            velDisplay.innerText = state.velocity + ' m/s';
        });

        // --- Resize Handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateParticles();
            renderer.render(scene, camera);
        }
        
        // Start
        init();
        animate();

    </script>
</body>
</html>
