<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Image & Video Dither</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/svg+xml" href="/favicon.svg">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="sidebar">
            <header>
                <h1>Media Dither</h1>
                <p>Convert images and videos to 1-bit black and white using classic algorithms directly in your browser.</p>
            </header>
            
            <div class="setting">
                <label for="mediaInput">Select Media (Image or Video):</label>
                <input type="file" id="mediaInput" accept="image/*,video/*">
            </div>
            
            <div class="setting">
                <label for="algoSelect">Algorithm:</label>
                <select id="algoSelect">
                    <optgroup label="Error Diffusion (High Quality, Slower)">
                        <option value="floyd">Floyd-Steinberg</option>
                        <option value="atkinson">Atkinson (Classic Mac)</option>
                        <option value="jjn">Jarvis-Judice-Ninke</option>
                    </optgroup>
                    <optgroup label="Ordered (Fast, Best for Video)">
                        <option value="bayer2">Bayer (2x2)</option>
                        <option value="bayer4">Bayer (4x4)</option>
                        <option value="bayer8">Bayer (8x8)</option>
                    </optgroup>
                    <optgroup label="Other">
                        <option value="random">Random Noise</option>
                        <option value="threshold">Threshold (No Dither)</option>
                    </optgroup>
                </select>
            </div>

            <div class="setting">
                <label for="scaleSlider">Scale (Resolution): <span id="scaleValue">100%</span></label>
                <input type="range" id="scaleSlider" min="5" max="100" value="100" step="5">
                <small>Lower scale improves video performance.</small>
            </div>

            <hr>

            <div class="setting" id="imageControls">
                <button id="imgDownloadBtn" disabled>Download Dithered GIF</button>
            </div>

            <div id="videoContainer" style="display: none;">
                <div class="setting">
                     <button id="vidDownloadBtn">Download Processed GIF</button>
                     <small style="display: block; margin-top: 5px;">Requires playing video through once to render.</small>
                </div>

                <div class="video-controls-bar setting">
                    <button id="playPauseBtn">▶</button>
                    <span id="currentTimeText">0:00</span>
                    <input type="range" id="videoProgress" min="0" max="100" value="0" step="any">
                    <span id="durationText">0:00</span>
                </div>
            </div>
            
            <div class="setting" id="status">
                Waiting for media...
            </div>

            <footer>
                <p>©2026 Nathan James Sharp. All Rights Reserved.</p>
            </footer>
        </div>

        <div class="viewer">
            <canvas id="canvas"></canvas>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
        <script src="scripts.js"></script>
    </body>
</html>
