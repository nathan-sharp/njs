<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Pendulum with Real-time Graphs</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Double Pendulum Physics</h2>


    <div style="text-align: center; margin-bottom: 20px;">
        <a href="/double-pendulum/graph/" style="display: inline-block; padding: 8px 16px; background-color: #2a2a2a; color: #4CAF50; text-decoration: none; border: 1px solid #4CAF50; border-radius: 4px; font-size: 0.9rem; transition: all 0.2s;">
            Multi Pendulum Comparison Grid &rarr;
        </a>
    </div>

    <div class="dashboard">
        <!-- Main Simulation -->
        <div class="main-view">
            <canvas id="simCanvas"></canvas>
        </div>

        <!-- Left Column: Angle Graphs Stacked -->
        <div class="angle-wrapper">
            <!-- Graph 1: Top Angle -->
            <div class="graph-container">
                <div class="graph-title">Top Angle (θ1) over Time</div>
                <canvas id="angle1Graph"></canvas>
            </div>

            <!-- Graph 2: Bottom Angle -->
            <div class="graph-container">
                <div class="graph-title">Bottom Angle (θ2) over Time</div>
                <canvas id="angle2Graph"></canvas>
            </div>
        </div>
        
        <!-- Right Column: Config Space -->
        <div class="graph-container">
            <div class="graph-title">Config Space (θ1 vs θ2)</div>
            <canvas id="configGraph"></canvas>
        </div>

        <!-- Settings Panel -->
        <div class="settings-panel">
            <h3>Physical Parameters (Live)</h3>
            <div class="control-grid">
                <div class="control-item">
                    <label>Mass 1 (Top): <span id="disp-m1">10</span></label>
                    <input type="range" id="inp-m1" min="1" max="50" value="10">
                </div>
                <div class="control-item">
                    <label>Mass 2 (Bottom): <span id="disp-m2">10</span></label>
                    <input type="range" id="inp-m2" min="1" max="50" value="10">
                </div>
                <div class="control-item">
                    <label>Length 1: <span id="disp-r1">100</span></label>
                    <input type="range" id="inp-r1" min="50" max="150" value="100">
                </div>
                <div class="control-item">
                    <label>Length 2: <span id="disp-r2">100</span></label>
                    <input type="range" id="inp-r2" min="50" max="150" value="100">
                </div>
                <div class="control-item">
                    <label>Gravity (m/s²): <span id="disp-g">9.8</span></label>
                    <input type="range" id="inp-g" min="0" max="25" step="0.1" value="9.8">
                </div>
                <!-- Friction Control -->
                <div class="control-item">
                    <label>Friction (%): <span id="disp-friction">0</span></label>
                    <input type="range" id="inp-friction" min="0" max="100" step="1" value="0">
                </div>
                <div class="control-item">
                    <label>Trace Length: <span id="disp-trace">150</span></label>
                    <input type="range" id="inp-trace" min="0" max="1000" step="10" value="150">
                </div>
            </div>

            <h3>Restart Conditions</h3>
            <div class="control-grid">
                <div class="control-item">
                    <label>Start Angle 1 (deg): <span id="disp-sa1">90</span></label>
                    <input type="range" id="inp-sa1" min="0" max="360" value="90">
                </div>
                <div class="control-item">
                    <label>Start Angle 2 (deg): <span id="disp-sa2">90</span></label>
                    <input type="range" id="inp-sa2" min="0" max="360" value="90">
                </div>
                <div class="control-item" style="justify-content:flex-end;">
                     <label style="flex-direction:row; justify-content:flex-start; gap:10px; align-items:center;">
                        <input type="checkbox" id="inp-random" style="width:auto;" checked> 
                        Randomize on Restart
                     </label>
                </div>
            </div>

            <div class="main-controls">
                <button onclick="resetSim()">Restart Simulation</button>
                <button class="secondary" onclick="togglePause()" id="btn-pause">Pause</button>
                <button class="secondary" onclick="clearTrails()">Clear Trails</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
