<!DOCTYPE html>
<html>
    <head>
        <title>Analog Clock | NJS.dev</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/svg+xml" href="/favicon.svg">
        <style>
            *, *::before, *::after { box-sizing: border-box; }

            html, body {
                height: 100%;
                margin: 0;
            }

            body {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                background: #000000;
                color: #ffffff;
                overflow-x: hidden;
                font-family: Roboto Mono, monospace;
            }

            main {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                padding: 2vh 2vw;
            }

            svg {
                width: 100%;
                height: 100%;
                max-width: 90vmin;
                max-height: 90vmin;
            }
        </style>
    </head>
    <body>
        <main>
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <!-- Outer circle -->
                <circle cx="100" cy="100" r="95" fill="none" stroke="#ffffff" stroke-width="2"/>
                
                <!-- Hour markers -->
                <g id="markers" stroke="#ffffff">
                    <line x1="100" y1="10" x2="100" y2="25" stroke-width="2"/>
                    <line x1="100" y1="10" x2="100" y2="25" stroke-width="2" transform="rotate(30 100 100)"/>
                    <line x1="100" y1="10" x2="100" y2="25" stroke-width="2" transform="rotate(60 100 100)"/>
                    <line x1="100" y1="10" x2="100" y2="25" stroke-width="2" transform="rotate(90 100 100)"/>
                    <line x1="100" y1="10" x2="100" y2="25" stroke-width="2" transform="rotate(120 100 100)"/>
                    <line x1="100" y1="10" x2="100" y2="25" stroke-width="2" transform="rotate(150 100 100)"/>
                    <line x1="100" y1="10" x2="100" y2="25" stroke-width="2" transform="rotate(180 100 100)"/>
                    <line x1="100" y1="10" x2="100" y2="25" stroke-width="2" transform="rotate(210 100 100)"/>
                    <line x1="100" y1="10" x2="100" y2="25" stroke-width="2" transform="rotate(240 100 100)"/>
                    <line x1="100" y1="10" x2="100" y2="25" stroke-width="2" transform="rotate(270 100 100)"/>
                    <line x1="100" y1="10" x2="100" y2="25" stroke-width="2" transform="rotate(300 100 100)"/>
                    <line x1="100" y1="10" x2="100" y2="25" stroke-width="2" transform="rotate(330 100 100)"/>
                </g>

                <!-- Hour hand -->
                <line id="hour-hand" x1="100" y1="100" x2="100" y2="50" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
                
                <!-- Minute hand -->
                <line id="minute-hand" x1="100" y1="100" x2="100" y2="30" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
                
                <!-- Second hand -->
                <line id="second-hand" x1="100" y1="100" x2="100" y2="25" stroke="#888888" stroke-width="1" stroke-linecap="round"/>
                
                <!-- Center dot -->
                <circle cx="100" cy="100" r="3" fill="#ffffff"/>
            </svg>
        </main>

        <script>
            function updateClock() {
                const now = new Date();
                
                const seconds = now.getSeconds();
                const minutes = now.getMinutes();
                const hours = now.getHours() % 12;
                
                // Calculate rotation angles
                const secondDegrees = (seconds / 60) * 360;
                const minuteDegrees = (minutes / 60) * 360 + (seconds / 60) * 6;
                const hourDegrees = (hours / 12) * 360 + (minutes / 60) * 30;
                
                // Apply rotations
                document.getElementById('second-hand').setAttribute('transform', `rotate(${secondDegrees} 100 100)`);
                document.getElementById('minute-hand').setAttribute('transform', `rotate(${minuteDegrees} 100 100)`);
                document.getElementById('hour-hand').setAttribute('transform', `rotate(${hourDegrees} 100 100)`);
            }
            
            // Update every 1000ms
            setInterval(updateClock, 1000);
            updateClock(); // Initial call
        </script>
    </body>
</html>
