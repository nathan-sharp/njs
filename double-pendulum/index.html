<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Pendulum Simulation</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: #eee;
            font-family: 'Times New Roman', Times, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            overflow-x: hidden; /* Prevent horizontal scroll on body */
        }

        h2 { margin: 5px 0 15px 0; font-weight: 300; text-align: center;}

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            gap: 20px;
            max-width: 1000px;
            width: 100%;
            box-sizing: border-box;
        }

        /* The Main Pendulum View */
        .main-view {
            grid-column: 1 / -1; /* Span full width */
            display: flex;
            justify-content: center;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
            min-width: 0; /* CRITICAL: Allows grid item to shrink */
        }

        /* Wrapper for the left column (stacked angle graphs) */
        .angle-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 0; /* CRITICAL for grid responsiveness */
        }
        
        /* The Graph Containers */
        .graph-container {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0; /* CRITICAL */
        }

        .graph-title {
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #aaa;
            text-align: center;
        }

        canvas {
            background-color: #222;
            border-radius: 4px;
            border: 1px solid #333;
            width: 100%; /* Make canvas responsive visually */
            height: auto;
            display: block;
        }

        /* Settings Panel */
        .settings-panel {
            grid-column: 1 / -1;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            min-width: 0;
        }

        .settings-panel h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1rem;
            color: #4CAF50;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }

        .control-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-item label {
            font-size: 0.85rem;
            color: #ccc;
            display: flex;
            justify-content: space-between;
        }

        .control-item input[type="range"] {
            width: 100%;
            cursor: pointer;
            box-sizing: border-box; /* Ensure padding doesn't widen */
        }

        .main-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap; /* Allow buttons to wrap on tiny screens */
        }

        button {
            padding: 10px 24px;
            border: none;
            border-radius: 4px;
            background-color: #3f51b5;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            font-weight: bold;
            white-space: nowrap;
        }

        button:hover {
            background-color: #303f9f;
        }

        button.secondary {
            background-color: #555;
        }
        button.secondary:hover {
            background-color: #666;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            body {
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <h2>Double Pendulum</h2>

    <div class="dashboard">
        <!-- Main Simulation -->
        <div class="main-view">
            <canvas id="simCanvas"></canvas>
        </div>

        <!-- Left Column: Angle Graphs Stacked -->
        <div class="angle-wrapper">
            <!-- Graph 1: Top Angle -->
            <div class="graph-container">
                <div class="graph-title">Top Angle (θ1) over Time</div>
                <canvas id="angle1Graph"></canvas>
            </div>

            <!-- Graph 2: Bottom Angle -->
            <div class="graph-container">
                <div class="graph-title">Bottom Angle (θ2) over Time</div>
                <canvas id="angle2Graph"></canvas>
            </div>
        </div>
        
        <!-- Right Column: Config Space -->
        <div class="graph-container">
            <div class="graph-title">Config Space (θ1 vs θ2)</div>
            <canvas id="configGraph"></canvas>
        </div>

        <!-- Settings Panel -->
        <div class="settings-panel">
            <h3>Physical Parameters (Live)</h3>
            <div class="control-grid">
                <div class="control-item">
                    <label>Mass 1 (Top): <span id="disp-m1">10</span></label>
                    <input type="range" id="inp-m1" min="1" max="50" value="10">
                </div>
                <div class="control-item">
                    <label>Mass 2 (Bottom): <span id="disp-m2">10</span></label>
                    <input type="range" id="inp-m2" min="1" max="50" value="10">
                </div>
                <div class="control-item">
                    <label>Length 1: <span id="disp-r1">100</span></label>
                    <input type="range" id="inp-r1" min="50" max="150" value="100">
                </div>
                <div class="control-item">
                    <label>Length 2: <span id="disp-r2">100</span></label>
                    <input type="range" id="inp-r2" min="50" max="150" value="100">
                </div>
                <div class="control-item">
                    <label>Gravity (m/s²): <span id="disp-g">9.8</span></label>
                    <input type="range" id="inp-g" min="0" max="25" step="0.1" value="9.8">
                </div>
                <!-- Friction Control -->
                <div class="control-item">
                    <label>Friction (%): <span id="disp-friction">0</span></label>
                    <input type="range" id="inp-friction" min="0" max="100" step="1" value="0">
                </div>
                <div class="control-item">
                    <label>Trace Length: <span id="disp-trace">150</span></label>
                    <input type="range" id="inp-trace" min="0" max="1000" step="10" value="150">
                </div>
            </div>

            <h3>Restart Conditions</h3>
            <div class="control-grid">
                <div class="control-item">
                    <label>Start Angle 1 (deg): <span id="disp-sa1">90</span></label>
                    <input type="range" id="inp-sa1" min="0" max="360" value="90">
                </div>
                <div class="control-item">
                    <label>Start Angle 2 (deg): <span id="disp-sa2">90</span></label>
                    <input type="range" id="inp-sa2" min="0" max="360" value="90">
                </div>
                <div class="control-item" style="justify-content:flex-end;">
                     <label style="flex-direction:row; justify-content:flex-start; gap:10px; align-items:center;">
                        <input type="checkbox" id="inp-random" style="width:auto;" checked> 
                        Randomize on Restart
                     </label>
                </div>
            </div>

            <div class="main-controls">
                <button onclick="resetSim()">Restart Simulation</button>
                <button class="secondary" onclick="togglePause()" id="btn-pause">Pause</button>
                <button class="secondary" onclick="clearTrails()">Clear Trails</button>
            </div>
        </div>
        <p>©2026 Nathan James Sharp. All Rights Reserved.</p>
    </div>

<script>
    // --- Configuration & State ---
    const CONFIG = {
        baseSimWidth: 600,
        baseSimHeight: 400,
        graphHeight: 180, 
        historySize: 300,
        r1: 100,
        r2: 100,
        m1: 10,
        m2: 10,
        g: 9.8, // Default gravity Earth
        friction: 0, // Friction % (0-100)
        traceLength: 150
    };

    let state = {
        a1: Math.PI / 2,
        a2: Math.PI / 2,
        a1_v: 0,
        a2_v: 0,
        path: [],
        history: [],
        paused: false,
        scale: 1 
    };

    // --- DOM Elements ---
    const simCanvas = document.getElementById('simCanvas');
    const simCtx = simCanvas.getContext('2d');
    
    // Split Angle Graphs
    const angle1GraphCanvas = document.getElementById('angle1Graph');
    const angle1Ctx = angle1GraphCanvas.getContext('2d');
    const angle2GraphCanvas = document.getElementById('angle2Graph');
    const angle2Ctx = angle2GraphCanvas.getContext('2d');

    const configGraphCanvas = document.getElementById('configGraph');
    const configCtx = configGraphCanvas.getContext('2d');

    // Inputs
    const inputs = {
        m1: document.getElementById('inp-m1'),
        m2: document.getElementById('inp-m2'),
        r1: document.getElementById('inp-r1'),
        r2: document.getElementById('inp-r2'),
        g: document.getElementById('inp-g'),
        friction: document.getElementById('inp-friction'), // New input ID
        trace: document.getElementById('inp-trace'),
        sa1: document.getElementById('inp-sa1'),
        sa2: document.getElementById('inp-sa2'),
        random: document.getElementById('inp-random')
    };

    const displays = {
        m1: document.getElementById('disp-m1'),
        m2: document.getElementById('disp-m2'),
        r1: document.getElementById('disp-r1'),
        r2: document.getElementById('disp-r2'),
        g: document.getElementById('disp-g'),
        friction: document.getElementById('disp-friction'), // New display ID
        trace: document.getElementById('disp-trace'),
        sa1: document.getElementById('disp-sa1'),
        sa2: document.getElementById('disp-sa2')
    };

    // --- Initialization & Events ---
    function init() {
        resize();
        setupListeners();
        resetSim();
        animate();
    }

    function setupListeners() {
        // Helper to bind input to CONFIG and Display
        const bind = (key, configKey) => {
            inputs[key].addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                CONFIG[configKey] = val;
                displays[key].innerText = val;
            });
        };

        bind('m1', 'm1');
        bind('m2', 'm2');
        bind('r1', 'r1');
        bind('r2', 'r2');
        bind('g', 'g');
        bind('friction', 'friction'); // Bind new friction control
        
        inputs.trace.addEventListener('input', (e) => {
            CONFIG.traceLength = parseInt(e.target.value);
            displays.trace.innerText = CONFIG.traceLength;
        });

        inputs.sa1.addEventListener('input', (e) => displays.sa1.innerText = e.target.value);
        inputs.sa2.addEventListener('input', (e) => displays.sa2.innerText = e.target.value);
        
        inputs.random.addEventListener('change', (e) => {
            inputs.sa1.disabled = e.target.checked;
            inputs.sa2.disabled = e.target.checked;
            inputs.sa1.parentElement.style.opacity = e.target.checked ? 0.5 : 1;
            inputs.sa2.parentElement.style.opacity = e.target.checked ? 0.5 : 1;
        });
        
        inputs.random.dispatchEvent(new Event('change'));
    }

    function resetSim() {
        if (inputs.random.checked) {
            state.a1 = Math.PI / 2 + (Math.random() * 1 - 0.5);
            state.a2 = Math.PI / 2 + (Math.random() * 1 - 0.5);
        } else {
            state.a1 = parseFloat(inputs.sa1.value) * (Math.PI / 180);
            state.a2 = parseFloat(inputs.sa2.value) * (Math.PI / 180);
        }
        
        state.a1_v = 0;
        state.a2_v = 0;
        state.path = [];
        state.history = [];
    }

    function togglePause() {
        state.paused = !state.paused;
        document.getElementById('btn-pause').innerText = state.paused ? "Resume" : "Pause";
    }

    function clearTrails() {
        state.path = [];
        state.history = [];
    }

    // --- Physics Engine ---
    function updatePhysics() {
        if (state.paused) return;

        const { r1, r2, m1, m2, g } = CONFIG;
        let { a1, a2, a1_v, a2_v } = state;
        
        // Time step multiplier:
        // Since we increased G from 1 to 9.8 (approx 10x), forces are 10x stronger.
        // To keep the integration stable and visual speed pleasing, we use a smaller dt.
        const dt = 0.2; 

        // Lagrangian Equations
        let num1 = -g * (2 * m1 + m2) * Math.sin(a1);
        let num2 = -m2 * g * Math.sin(a1 - 2 * a2);
        let num3 = -2 * Math.sin(a1 - a2) * m2;
        let num4 = a2_v * a2_v * r2 + a1_v * a1_v * r1 * Math.cos(a1 - a2);
        let den = r1 * (2 * m1 + m2 - m2 * Math.cos(2 * a1 - 2 * a2));
        
        let a1_a = (num1 + num2 + num3 * num4) / den;

        let num5 = 2 * Math.sin(a1 - a2);
        let num6 = (a1_v * a1_v * r1 * (m1 + m2));
        let num7 = g * (m1 + m2) * Math.cos(a1);
        let num8 = a2_v * a2_v * r2 * m2 * Math.cos(a1 - a2);
        let den2 = r2 * (2 * m1 + m2 - m2 * Math.cos(2 * a1 - 2 * a2));
        
        let a2_a = (num5 * (num6 + num7 + num8)) / den2;

        // Apply Time Step to integration
        state.a1_v += a1_a * dt;
        state.a2_v += a2_a * dt;
        state.a1 += state.a1_v * dt;
        state.a2 += state.a2_v * dt;

        // Apply Friction
        // Convert 0-100 scale to a damping factor ~1.0 to 0.9
        // 0 friction => 1.0 multiplier
        // 100 friction => 0.990 multiplier (change divisor to tune strength)
        let dampFactor = 1.0 - (CONFIG.friction / 5000); 
        
        state.a1_v *= dampFactor;
        state.a2_v *= dampFactor;

        // --- STABILITY FIX: Velocity Clamping ---
        // Adjusted for new dt scale
        const MAX_VEL = 0.5 / dt; 
        if (state.a1_v > MAX_VEL) state.a1_v = MAX_VEL;
        if (state.a1_v < -MAX_VEL) state.a1_v = -MAX_VEL;
        if (state.a2_v > MAX_VEL) state.a2_v = MAX_VEL;
        if (state.a2_v < -MAX_VEL) state.a2_v = -MAX_VEL;
    }

    // --- Rendering ---
    function drawSimulation() {
        const w = simCanvas.width;
        const h = simCanvas.height;
        const cx = w / 2;
        const cy = h / 3;

        simCtx.fillStyle = '#222';
        simCtx.fillRect(0, 0, w, h);

        simCtx.save();
        if (w < 600) {
            const scaleFactor = w / 600;
            simCtx.translate(cx, cy);
            simCtx.scale(scaleFactor, scaleFactor);
            simCtx.translate(-cx, -cy);
        }

        let x1 = CONFIG.r1 * Math.sin(state.a1);
        let y1 = CONFIG.r1 * Math.cos(state.a1);
        let x2 = x1 + CONFIG.r2 * Math.sin(state.a2);
        let y2 = y1 + CONFIG.r2 * Math.cos(state.a2);

        if (!state.paused) {
            state.path.push({x: cx + x2, y: cy + y2});
            if (state.path.length > CONFIG.traceLength) state.path.shift();
        }

        if (state.path.length > 1) {
            simCtx.beginPath();
            simCtx.strokeStyle = "rgba(100, 200, 255, 0.3)";
            simCtx.lineWidth = 2;
            for (let i = 0; i < state.path.length - 1; i++) {
                simCtx.moveTo(state.path[i].x, state.path[i].y);
                simCtx.lineTo(state.path[i+1].x, state.path[i+1].y);
            }
            simCtx.stroke();
        }

        simCtx.strokeStyle = '#eee';
        simCtx.lineWidth = 3;
        simCtx.beginPath();
        simCtx.moveTo(cx, cy);
        simCtx.lineTo(cx + x1, cy + y1);
        simCtx.lineTo(cx + x2, cy + y2);
        simCtx.stroke();

        const drawBob = (x, y, m, color) => {
            simCtx.fillStyle = color;
            simCtx.beginPath();
            simCtx.arc(x, y, Math.sqrt(m) * 3, 0, 2 * Math.PI);
            simCtx.fill();
        };

        drawBob(cx + x1, cy + y1, CONFIG.m1, '#FF5722');
        drawBob(cx + x2, cy + y2, CONFIG.m2, '#03A9F4');
        
        simCtx.fillStyle = '#FFC107';
        simCtx.beginPath();
        simCtx.arc(cx, cy, 6, 0, 2 * Math.PI);
        simCtx.fill();

        simCtx.restore();
    }

    function drawAngleGraphs() {
        drawSingleAngleGraph(angle1Ctx, angle1GraphCanvas, 'a1', '#FF5722');
        drawSingleAngleGraph(angle2Ctx, angle2GraphCanvas, 'a2', '#03A9F4');
    }

    function drawSingleAngleGraph(ctx, canvas, prop, color) {
        const w = canvas.width;
        const h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        
        ctx.lineWidth = 1;
        ctx.strokeStyle = '#444';
        
        ctx.beginPath();
        ctx.moveTo(0, h/2);
        ctx.lineTo(w, h/2);
        ctx.stroke();

        ctx.fillStyle = '#888';
        ctx.font = '10px sans-serif';
        ctx.textBaseline = 'middle';
        ctx.fillText('0', 5, h/2 - 8);
        ctx.fillText('+π', 5, 10);
        ctx.fillText('-π', 5, h - 10);

        if (state.history.length < 2) return;

        const getX = (i) => (i / CONFIG.historySize) * w;
        // Range is now -PI to PI (2*PI total span)
        const scaleY = h / (2 * Math.PI); 
        const getY = (val) => h/2 - (val * scaleY);

        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        
        let twoPi = 2 * Math.PI;

        for(let i=0; i<state.history.length; i++) {
            let raw = state.history[i][prop];
            // Normalize to -PI ... PI
            let val = (raw % twoPi + twoPi) % twoPi;
            if (val > Math.PI) val -= twoPi;

            let x = getX(i);
            let y = getY(val);
            
            if(i===0) {
                ctx.moveTo(x, y);
            } else {
                // Prevent drawing vertical lines when wrapping
                let prevRaw = state.history[i-1][prop];
                let prevVal = (prevRaw % twoPi + twoPi) % twoPi;
                if (prevVal > Math.PI) prevVal -= twoPi;
                
                // If jump is huge (wrapping), don't draw line
                if (Math.abs(val - prevVal) > Math.PI) {
                     ctx.moveTo(x, y);
                } else {
                     ctx.lineTo(x, y);
                }
            }
        }
        ctx.stroke();
    }

    function drawConfigGraph() {
        const w = configGraphCanvas.width;
        const h = configGraphCanvas.height;
        const ctx = configCtx;

        ctx.fillStyle = 'rgba(34, 34, 34, 0.05)';
        ctx.fillRect(0, 0, w, h);

        ctx.save();
        ctx.strokeStyle = '#444';
        ctx.lineWidth = 1;
        
        ctx.beginPath(); ctx.moveTo(0, h/2); ctx.lineTo(w, h/2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(w/2, 0); ctx.lineTo(w/2, h); ctx.stroke();

        ctx.fillStyle = '#888';
        ctx.font = '10px sans-serif';
        ctx.fillText('θ2', w/2 + 5, 12);
        ctx.fillText('θ1', w - 20, h/2 - 5);
        ctx.restore();

        if (state.history.length < 1) return;
        const latest = state.history[state.history.length - 1];
        
        let twoPi = 2 * Math.PI;
        let a1Wrapped = (latest.a1 % twoPi + twoPi) % twoPi;
        if (a1Wrapped > Math.PI) a1Wrapped -= twoPi;
        
        let a2Wrapped = (latest.a2 % twoPi + twoPi) % twoPi;
        if (a2Wrapped > Math.PI) a2Wrapped -= twoPi;
        
        const x = (a1Wrapped / twoPi) * w + w / 2;
        const y = (a2Wrapped / twoPi) * h + h / 2;

        ctx.fillStyle = '#4CAF50';
        ctx.fillRect(x, y, 2, 2);
    }

    function animate() {
        updatePhysics();
        
        if (!state.paused) {
            state.history.push({
                a1: state.a1,
                a2: state.a2,
                v2: state.a2_v
            });
            if (state.history.length > CONFIG.historySize) {
                state.history.shift();
            }
        }

        drawSimulation();
        drawAngleGraphs();
        drawConfigGraph();

        requestAnimationFrame(animate);
    }

    function resize() {
        // Main view resize
        const mainContainer = document.querySelector('.main-view');
        const mainW = mainContainer.clientWidth - 20; 
        simCanvas.width = mainW;
        simCanvas.height = Math.min(400, mainW * 0.8);

        // Angle graphs resize (Left Column)
        // We get the width of the parent container of the canvas
        const angle1Container = angle1GraphCanvas.parentElement;
        const angleW = angle1Container.clientWidth - 20;
        
        angle1GraphCanvas.width = angleW;
        angle1GraphCanvas.height = CONFIG.graphHeight;
        
        angle2GraphCanvas.width = angleW;
        angle2GraphCanvas.height = CONFIG.graphHeight;
        
        // Config graph resize (Right Column)
        const configContainer = configGraphCanvas.parentElement;
        const configW = configContainer.clientWidth - 20;

        configGraphCanvas.width = configW;
        configGraphCanvas.height = configW; // Keep it square
    }

    window.addEventListener('resize', resize);
    
    init();

</script>
</body>
</html>
