name: Update footers

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-footers:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh footer metadata
        run: node scripts/update-footers.mjs
        env:
          VERSION_HASH: ${{ github.sha }}

      - name: Refresh sitemap
        run: node scripts/update-sitemap.mjs

      - name: Commit metadata updates
        run: |
          if git diff --quiet; then
            echo "No metadata changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: refresh footer and sitemap metadata"
          git push origin HEAD:${{ github.ref_name }}
